name: Build Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate keystore from password secret
        run: |
          keytool -genkey -v -keystore keystore.jks -alias ttvpn \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Shaun Cooper, OU=PayBridge, O=PayBridge, L=Cape Town, ST=Western Cape, C=ZA" \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEYSTORE_PASSWORD }}"

      - name: Build Release APK
        run: chmod +x gradlew && ./gradlew assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/TTVPN.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TTVPN
          path: app/build/outputs/apk/release/TTVPN.apk
